spring:
  application:
    name: keynor-core

  datasource:
    url: jdbc:postgresql://localhost:5432/keynor_core
    username: ${DB_USERNAME:keynor}
    password: ${DB_PASSWORD:keynor}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      authorizationserver:
        issuer: ${OAUTH2_ISSUER_URI:http://localhost:8080}

server:
  port: 8080
